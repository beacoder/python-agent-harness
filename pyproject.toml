[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-agent-harness"
version = "0.1.0"
description = "Python agent execution harness: agent loop, tools, plan/build modes, sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
# Tooling used by CI (lint + type check + wheel build + coverage + audit).
# Install with:  pip install -e ".[dev]"
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "build>=1.2",
    "coverage[toml]>=7.0",
    "pip-audit>=2.7",
]

[project.scripts]
python-agent-harness = "python_agent_harness.cli:main"

[tool.setuptools.packages.find]
include = ["python_agent_harness*"]

[tool.setuptools.package-data]
python_agent_harness = ["prompts/*.md", "prompts/commands/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Start with the pyflakes (F) + pycodestyle error (E) core. These pass on the
# current codebase, so CI is green from day one. Broaden `select` (e.g. add
# "I" for import sorting, "B" for bugbears, "UP" for pyupgrade) once the code
# is cleaned up with `ruff check --fix` / `ruff format`.
select = ["E", "F"]
# E501 (line-too-long) is left to the formatter; E741/E401 have a handful of
# pre-existing hits that are not worth churning right now.
ignore = ["E501", "E741", "E401"]

[tool.pyright]
include = ["python_agent_harness"]
pythonVersion = "3.11"
# "basic" surfaces the real Optional-access issues without the full strict
# firehose. The CI type-check job runs in report-only mode until the existing
# findings are burned down; flip it to blocking (remove continue-on-error in
# the workflow) once `pyright` reports zero errors.
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["python_agent_harness"]
branch = true
# The console/TUI entry points aren't exercised by unittest; omit the ones
# that would otherwise drag the number down without adding signal.
omit = ["python_agent_harness/__main__.py"]

[tool.coverage.report]
show_missing = true
# Current line + branch coverage is ~98%. Gate at 90 to leave headroom for
# small changes while still catching real regressions. Raise as coverage grows.
fail_under = 90
